[project]
name = "jalsetu-planner"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["ortools==9.15.6755", "pydantic==2.13.5"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
